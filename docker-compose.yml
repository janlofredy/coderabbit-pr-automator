name: coderabbit-auto-review

services:
  coderabbit-pr-automator:
    image: ghcr.io/janlofredy/coderabbit-pr-automator:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coderabbit-pr-automator
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - /DATA/AppData/coderabbit/config:/root/.coderabbit
      - /DATA/AppData/coderabbit/reviews:/root/.coderabbit/reviews
      - /DATA/AppData/coderabbit/repos:/app/repos
    x-casaos:
      title:
        en_us: "CodeRabbit Auto-Reviewer"
      tagline:
        en_us: "Automated AI code reviews for GitHub PRs using CodeRabbit CLI"
      description:
        en_us: "Headless continuous CI/CD background review service and real-time Web Dashboard that monitors GitHub repositories, performs AI code reviews via CodeRabbit CLI, posts per-file inline comments, handles Free Tier rate limits, and automatically approves clean PRs."
      icon: "https://raw.githubusercontent.com/coderabbitai/.github/main/profile/coderabbit-logo.png"
      thumbnail: "https://raw.githubusercontent.com/coderabbitai/.github/main/profile/coderabbit-logo.png"
      developer: "CodeRabbit"
      author: "janlofredy"
      port_map: "8765"
      index: "/"
      scheme: "http"
      category: "Development"
