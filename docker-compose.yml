name: coderabbit-auto-review

services:
  coderabbit-pr-automator:
    image: ghcr.io/janlofredy/coderabbit-pr-automator:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coderabbit-pr-automator
    restart: unless-stopped
    ports:
      - "${PORT:-8765}:8765"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ./data/config:/app/data/config
      - ./data/reviews:/app/data/reviews
      - ${CODERABBIT_CLI_HOME:-${HOME}/.coderabbit}:/root/.coderabbit
      - ./data/repos:/app/data/repos
